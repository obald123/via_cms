via_api.site_content:
  path: '/api/v1/site-content'
  defaults:
    _controller: '\Drupal\via_api\Controller\SiteContentController::get'
  methods: [GET]
  requirements:
    _permission: 'access content'

via_api.contact:
  path: '/api/v1/contact'
  defaults:
    _controller: '\Drupal\via_api\Controller\ContactController::post'
  methods: [POST]
  requirements:
    # The endpoint is deliberately open to anonymous visitors — it is a public
    # contact form. Abuse is handled by the honeypot field and flood control in
    # the controller rather than by an access check.
    _access: 'TRUE'

via_api.newsletter:
  path: '/api/v1/newsletter'
  defaults:
    _controller: '\Drupal\via_api\Controller\NewsletterController::post'
  methods: [POST]
  requirements:
    # Public signup form; abuse is handled by the honeypot and flood control.
    _access: 'TRUE'

via_api.job_application:
  path: '/api/v1/job-applications'
  defaults:
    _controller: '\Drupal\via_api\Controller\JobApplicationController::post'
  methods: [POST]
  requirements:
    _access: 'TRUE'

via_api.whistleblower:
  path: '/api/v1/whistleblower-reports'
  defaults:
    _controller: '\Drupal\via_api\Controller\WhistleblowerController::post'
  methods: [POST]
  requirements:
    _access: 'TRUE'

via_api.airtable_webhook:
  path: '/api/v1/airtable-webhook'
  defaults:
    _controller: '\Drupal\via_api\Controller\AirtableWebhookController::post'
  methods: [POST]
  requirements:
    # Airtable, not a Drupal user, calls this — authenticity is the
    # X-Airtable-Content-MAC signature checked inside the controller, not a
    # Drupal permission.
    _access: 'TRUE'

via_api.document_download:
  path: '/api/v1/documents/{node}/download'
  defaults:
    _controller: '\Drupal\via_api\Controller\DocumentController::download'
  methods: [GET]
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    node: '\d+'
    _entity_access: 'node.view'
